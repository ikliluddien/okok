<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Google Apps Script</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }
        h2 {
            margin-bottom: 15px;
            color: #2c3e50;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            background-color: #10b981;
            color: white;
            padding: 14px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Akses Aplikasi</h2>
        <p>Silakan klik tombol di bawah ini untuk membuka halaman utama aplikasi Google Apps Script Anda:</p>
        <a class="btn" href="https://script.google.com/macros/s/AKfycbxq2wiYio-41HvwsRyhMOowjY0pT9XLvlERZ7QY6XUzb1kbEtdJ70F75a3ILxnBsZkOLg/exec" target="_blank">Buka Aplikasi Sekarang</a>
    </div>
</body>
</html>
